# Único flujo vigente de compilación, pruebas JVM y emulador Android.
name: Agenda Clara 3.9.8 · Compilación y validación
on:
  push:
    branches: [main, feat/top-plus-png-motion-3-8-2, feat/remove-compose-daily-view-3-8-2, feat/full-ui-categories-responsive-3-8-2, feat/category-only-agenda-navigation-3-8-2, feat/reference-iconography-branded-pickers-3-8-2, feat/png-approved-icons-symbol-color-pickers-3-8-2, feat/restore-nav-icons-performance-cleanup-3-8-2, feat/sticky-notes-plus-menu-3-9-0, feat/sticky-notes-home-widget-3-9-1, fix/category-selected-png-icons-3-9-2, feat/polished-sticky-art-3-9-3, feat/sticky-responsive-accessibility-3-9-4, feat/whatsapp-context-understanding-3-9-5, feat/schedule-photo-course-reconciliation-3-9-6, feat/schedule-per-day-12h-3-9-7, feat/calendar-png-today-schedule-3-9-8]
    paths:
      - 'updates/**'
      - 'Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip'
      - '.github/workflows/agenda-clara-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'updates/**'
      - 'Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip'
      - '.github/workflows/agenda-clara-ci.yml'
  workflow_dispatch:

concurrency:
  group: agenda-clara-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construir-y-validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivo de fuentes sin clave
        shell: bash
        run: |
          set -euo pipefail
          test -s Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip
          unzip -t Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip | tail -1
          if unzip -Z1 Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip | grep -Eq '\.(jks|keystore)$'; then
            echo 'ERROR: No publiques archivos de firma en el repositorio.'
            exit 1
          fi
          unzip -q Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip
          test -s AgendaClara/gradlew
          test -s AgendaClara/app/build.gradle
          test -s AgendaClara/gradle/wrapper/gradle-wrapper.jar
          python3 updates/apply_1_3_1.py
          python3 AgendaClara/tests/test_cleanup_sqlite.py
          python3 updates/test_1_3_1.py
          python3 updates/apply_1_4_0.py
          python3 updates/test_1_4_0.py
          python3 updates/apply_1_5_0.py
          python3 updates/apply_2_0_0.py
          python3 updates/test_2_0_0.py
          python3 updates/apply_2_1_0.py
          python3 updates/test_2_1_0.py
          python3 updates/apply_2_2_0.py
          python3 updates/test_2_2_0.py
          python3 updates/apply_2_3_0.py
          python3 updates/test_2_3_0.py
          python3 updates/apply_2_4_0.py
          python3 updates/apply_2_5_0.py
          python3 updates/test_2_5_0.py
          python3 updates/apply_2_6_0.py
          python3 updates/apply_2_6_1.py
          python3 updates/apply_2_7_0.py
          python3 updates/apply_2_8_0.py
          python3 updates/apply_2_9_0.py
          python3 updates/apply_3_0_0.py
          python3 updates/apply_3_1_0.py
          python3 updates/apply_3_2_0.py
          python3 updates/apply_3_3_0.py
          python3 updates/apply_3_4_0.py
          python3 updates/apply_3_5_0.py
          python3 updates/apply_3_6_0.py
          python3 updates/apply_3_7_0.py
          python3 updates/interpretation/apply.py
          python3 updates/phase15/apply_3_7_1.py
          python3 updates/phase15/test_3_7_1.py
          python3 updates/test_3_7_0.py
          python3 updates/test_3_6_0.py
          python3 updates/phase16/apply_3_8_0.py
          python3 updates/phase16/test_3_8_0.py
          python3 updates/phase17/apply_3_8_1.py
          python3 updates/phase17/test_3_8_1.py
          python3 updates/phase18/apply_3_8_2.py
          python3 updates/phase18/test_3_8_2.py
          python3 updates/phase30/apply_3_9_0.py
          python3 updates/phase30/test_3_9_0.py
          python3 updates/phase31/apply_3_9_1.py
          python3 updates/phase31/test_3_9_1.py
          python3 updates/phase32/apply_3_9_2.py
          python3 updates/phase32/test_3_9_2.py
          python3 updates/phase33/apply_3_9_3.py
          python3 updates/phase33/test_3_9_3.py
          python3 updates/phase34/apply_3_9_4.py
          python3 updates/phase34/test_3_9_4.py
          python3 updates/phase35/apply_3_9_5.py
          python3 updates/phase35/test_3_9_5.py
          python3 updates/phase36/apply_3_9_6.py
          python3 updates/phase36/test_3_9_6.py
          python3 updates/phase37/apply_3_9_7.py
          python3 updates/phase37/test_3_9_7.py
          python3 updates/phase38/apply_3_9_8.py
          python3 updates/phase38/test_3_9_8.py
          python3 updates/phase29/test_performance_qa.py

      - name: Recuperar clave de desarrollo privada
        shell: bash
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_JKS_BASE64" ]; then
            echo 'ERROR: Configura el secreto de GitHub Actions SIGNING_JKS_BASE64.'
            exit 1
          fi
          mkdir -p AgendaClara/signing
          printf '%s' "$SIGNING_JKS_BASE64" | base64 -d > AgendaClara/signing/development.jks
          chmod 600 AgendaClara/signing/development.jks
          keytool -list -v -keystore AgendaClara/signing/development.jks -storepass android -alias agendaclara > certificado.txt
          if ! grep -q '92:32:F9:E8:BC:93:19:7D:2D:40:28:00:D1:1A:6C:10:27:B6:F2:F4:22:10:C4:F1:2E:A2:37:42:0D:F9:6E:B3' certificado.txt; then
            echo 'ERROR: la firma no coincide con el certificado de Agenda Clara 1.2.1.'
            exit 1
          fi
          rm -f certificado.txt

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pruebas JVM de clasificación y contexto
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" "$SRC/MultiActivityInterpreter.java"
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT"             "$SRC/WhatsAppUnderstandingEngine.java" "$SRC/ActivityClassifier.java" "$SRC/MessageParser.java"             "$SRC/ConversationAnalyzer.java" "$SRC/ConversationIntent.java" "$SRC/HistoryTextParser.java"             "$SRC/Task.java" "$SRC/TaskLogic.java" "$SRC/TaskExpiryPolicy.java"             "$SRC/DoubleTapGate.java" "$SRC/TextHash.java" "$SRC/TaskSummary.java"             AgendaClara/tests/CoreTests.java AgendaClara/tests/ConversationTests.java             updates/Phase3Tests.java updates/Phase4Tests.java
          java -cp "$OUT" CoreTests
          java -cp "$OUT" ConversationTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" updates/phase35/WhatsAppUnderstandingPrototypeTests.java
          java -cp "$OUT" WhatsAppUnderstandingPrototypeTests
          java -cp "$OUT" Phase3Tests
          java -cp "$OUT" Phase4Tests
          javac -encoding UTF-8 -d "$OUT" "$SRC/NotificationSummaryPolicy.java" updates/phase16/NotificationSummaryPolicyTest.java
          java -cp "$OUT" pe.agendaclara.app.NotificationSummaryPolicyTest
          javac -encoding UTF-8 -d "$OUT" "$SRC/SecureArchive.java" updates/phase5/Phase5Tests.java
          java -cp "$OUT" Phase5Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/TaskOrganization.java" "$SRC/AgendaFilters.java" "$SRC/ReviewFilters.java" updates/phase6/Phase6Tests.java
          java -cp "$OUT" Phase6Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/WeeklyPlanner.java" updates/phase7/Phase7Tests.java
          java -cp "$OUT" Phase7Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" AgendaClara/tests/Phase8Tests.java
          java -cp "$OUT" Phase8Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleEntry.java" "$SRC/ScheduleCourseColors.java" "$SRC/ScheduleParser.java" updates/phase10/ScheduleCoreTests.java
          java -cp "$OUT" ScheduleCoreTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleDayClock.java" updates/phase37/ScheduleDayClockTests.java
          java -cp "$OUT" ScheduleDayClockTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleGridInterpreter.java" updates/phase12/SchedulePhotoGridTests.java
          java -cp "$OUT" SchedulePhotoGridTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleConflict.java" "$SRC/SchedulePeriod.java" updates/phase11/ScheduleImprovementTests.java
          java -cp "$OUT" ScheduleImprovementTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleVirtualGrid.java" updates/phase13/Phase13CoreTest.java
          java -cp "$OUT" Phase13CoreTest
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleColorSpectrum.java" updates/phase14/ScheduleStage14Test.java
          java -cp "$OUT" ScheduleStage14Test
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleCourseRecognition.java" "$SRC/SchedulePhotoReview.java" updates/phase17/SchedulePhotoReviewTests.java
          java -cp "$OUT" SchedulePhotoReviewTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" updates/phase36/SchedulePhotoIntelligenceTests.java
          java -cp "$OUT" pe.agendaclara.app.SchedulePhotoIntelligenceTests

      - name: Preparar Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER" || { echo "Android SDK cmdline-tools no están disponibles"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Preparar cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK Android
        working-directory: AgendaClara
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Validar estructura, firma y aplicación
        shell: bash
        run: |
          set -euo pipefail
          APK=AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -12
          echo "$BADGING" | grep -q "name='pe.agendaclara.app' versionCode='39' versionName='3.9.8'"
          echo "PASS: package pe.agendaclara.app, version 3.9.8 (39), signed Android APK"

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.9.8-APK
          path: AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Empaquetar fuentes verificadas sin firma
        shell: bash
        run: |
          set -euo pipefail
          rm -f AgendaClara/signing/development.jks
          rm -rf AgendaClara/.gradle AgendaClara/app/build AgendaClara/build
          zip -q -r Agenda-Clara-3.9.8-Fuentes-Verificadas.zip AgendaClara -x 'AgendaClara/signing/*' 'AgendaClara/*.jks' 'AgendaClara/*.keystore'
          if unzip -Z1 Agenda-Clara-3.9.8-Fuentes-Verificadas.zip | grep -Eq '\.(jks|keystore)$'; then exit 1; fi
      - name: Publicar fuentes 3.9.8
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.9.8-Fuentes-Verificadas
          path: Agenda-Clara-3.9.8-Fuentes-Verificadas.zip
          retention-days: 30
          if-no-files-found: error

  prueba-android-emulador:
    needs: construir-y-validar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtener pruebas de interfaz
        uses: actions/checkout@v4
      - name: Recuperar APK compilada
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-3.9.8-APK
          path: artifact-apk
      - name: Preparar aceleración para emulador
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Probar instalación y navegación en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: agenda-clara-ui
          disable-animations: true
          script: bash updates/phase16/emulator_3_8.sh
      - name: Publicar capturas sintéticas del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.9.8-Emulator-Capturas
          path: screenshots/
          if-no-files-found: ignore
