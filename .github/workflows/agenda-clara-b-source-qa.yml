name: Agenda Clara - Entrega B - QA de fuentes sin APK
on:
  push:
    branches: [feat/plan-estudio-entrega-b-20261104]
    paths:
      - 'updates/phase72/**'
      - '.github/workflows/agenda-clara-b-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verificar-fuentes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Revisar scripts y enlaces de funcionalidades
        run: python3 updates/phase72/test_plan_b.py
      - name: Preparar Java 17 solo para pruebas JVM
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probar reconocimiento de cursos y fechas sin Android
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          javac -encoding UTF-8 -d "$OUT"             updates/phase72/AcademicCourseMatcher.java             updates/phase72/SyllabusEventParser.java             updates/phase72/PhaseBParserTests.java
          java -cp "$OUT" pe.agendaclara.app.PhaseBParserTests
          echo 'PASS: solo pruebas JVM; NO Gradle, NO APK, NO firma'

  aplicar-parches-sin-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obtener codigo de Agenda Clara
        uses: actions/checkout@v4
      - name: Recuperar fuentes verificadas 3.13.2 sin recompilar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41897460411 --repo "$GITHUB_REPOSITORY" \
            --name Agenda-Clara-3.13.2-Fuentes-Verificadas --dir source-artifact
          unzip -q source-artifact/Agenda-Clara-3.13.2-Fuentes-Verificadas.zip
          test -s AgendaClara/app/src/main/java/pe/agendaclara/app/MainActivity.java
      - name: Aplicar y comprobar Entrega A sin Gradle
        run: |
          python3 updates/phase71/apply_plan_a.py
          python3 updates/phase71/test_plan_a.py
      - name: Aplicar y comprobar Entrega B sin Gradle
        run: |
          python3 updates/phase72/apply_plan_b.py
          python3 updates/phase72/test_plan_b.py
          echo 'PASS: transformaciones reales verificadas; NO APK, NO emulador'
