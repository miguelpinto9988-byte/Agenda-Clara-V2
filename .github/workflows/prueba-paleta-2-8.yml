name: Prueba Agenda Clara 2.8.0 palette en emulador AOSP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prueba-paleta-2-8.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probar-paleta:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Descargar pruebas
        uses: actions/checkout@v4
      - name: Recuperar APK ya firmada
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-2.8.0-APK
          run-id: 40059874199
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact-apk
      - name: Preparar aceleración Android
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Probar navegación y paleta en Android sin Pixel Launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: bash updates/phase13/emulator_palette.sh
      - name: Publicar capturas de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-2.8.0-Paleta-Capturas
          path: screenshots/
          if-no-files-found: ignore
