          python3 updates/phase45/test_natural_voice_3_10_8.py
          python3 updates/phase46/apply_keyboard_restore_3_10_9.py
          python3 updates/phase46/test_keyboard_restore_3_10_9.py
          python3 updates/phase47/apply_widget_floating_3_11_0.py
          python3 updates/phase47/restore_pre_ime_dialog_height.py
          python3 updates/phase47/restore_full_window_metrics.py
          python3 updates/phase47/install_widget_debug_qa_route.py
          python3 updates/phase47/test_widget_floating_3_11_0.py
          python3 updates/phase48/apply_context_3_11_1.py
          python3 updates/phase48/test_context_3_11_1.py
          python3 updates/phase49/apply_white_widgets_3_11_2.py
          python3 updates/phase49/test_white_widgets_3_11_2.py
          python3 updates/phase50/apply_widgets_3_11_3.py
          python3 updates/phase50/test_widgets_3_11_3.py
          python3 updates/phase51/test_installer.py
          python3 updates/phase51/stage_text_resources.py
          python3 updates/phase51/install_bundled_artwork.py
          python3 updates/phase51/apply_mi_dia.py
          python3 updates/phase52/apply_header.py
          python3 updates/phase52/test_header.py
          # Design-ready phases 6-8. These steps run only after this branch is
          # explicitly merged; feature-branch pushes are excluded by CI triggers.
          python3 updates/phase53/apply_dashboard.py
          python3 updates/phase54/apply_navigation.py
          python3 updates/phase55/apply_polish.py
          python3 updates/phase53/test_dashboard_static.py
          python3 updates/phase54/test_navigation_static.py
          python3 updates/phase55/test_release_readiness_static.py
          python3 updates/phase55/version_3_12_0.py
          # Phases 9–11 are prepared but DO NOT trigger builds from this branch.
          # These migrations will execute only once the user approves a final build.
          python3 updates/phase56/apply_hero.py
          python3 updates/phase57/apply_schedule.py
          python3 updates/phase58/apply_activities.py
          python3 updates/phase59/test_9_11_static.py
          python3 updates/phase60/apply_quick_actions.py
          python3 updates/phase61/apply_motivation.py
          python3 updates/phase61/apply_responsive_header.py
          python3 updates/phase62/apply_responsive.py
          python3 updates/phase63/test_12_14_static.py
          python3 updates/phase62/version_3_13_0.py
          python3 updates/phase62/test_release_static.py
          # Phases 15–17 are prepared, but branch pushes do NOT trigger CI.
          # Compiling and emulator QA require separate authorization.
          python3 updates/phase64/apply_header_blends.py
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 updates/phase65/normalize_backgrounds.py
          python3 updates/phase66/test_header_assets_static.py
          python3 updates/phase67/test_phase18_regressions.py
          python3 updates/phase68/version_3_13_1.py
          python3 updates/phase68/test_phase19_release.py
          # Staged only on this no-build branch; not added to CI push triggers.
          python3 updates/phase69/apply_home_quick_actions.py
          python3 updates/phase69/test_home_quick_actions_static.py
          # Iconografía aprobada; instalar 68 PNG sin modificar flujos existentes.
          python3 updates/phase70/apply_iconography.py
          python3 updates/phase70/test_iconography.py
          python3 - <<'PY'
          from pathlib import Path
          app = Path("AgendaClara/app/src/main")
          main = (app / "java/pe/agendaclara/app/MainActivity.java").read_text()
          dashboard = (app / "java/pe/agendaclara/app/MiDiaDashboard.java").read_text()
          assert 'MiDiaNavigation.selectedTab(this)' in main
          assert 'void tasksPage()' in main
          assert 'CalendarBridge.selectedEvents(activity)' in dashboard
          assert 'MiDiaDayMetrics.calculate(tasks, dayStart, dayEnd)' in dashboard
          print("PASS phase51: home attached to the existing task and calendar data")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("AgendaClara/app/src/main")
          quotes = ET.parse(root / "res/values/mi_dia_frases.xml").getroot().find("./string-array[@name='mi_dia_frases']")
          assert quotes is not None and len(quotes.findall("item")) == 50
          assert all((item.text or "").strip() for item in quotes.findall("item"))
          for name in ("MiDiaDailyRotation.java", "MiDiaHeaderView.java"):
              source = root / "java/pe/agendaclara/app" / name
              assert source.is_file() and "package pe.agendaclara.app;" in source.read_text()
          print("PASS phase51 staged Java and 50 quotes")
          PY
          python3 updates/phase29/test_performance_qa.py

      - name: Recuperar clave de desarrollo privada
        shell: bash
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_JKS_BASE64" ]; then
            echo 'ERROR: Configura el secreto de GitHub Actions SIGNING_JKS_BASE64.'
            exit 1
          fi
          mkdir -p AgendaClara/signing
          printf '%s' "$SIGNING_JKS_BASE64" | base64 -d > AgendaClara/signing/development.jks
          chmod 600 AgendaClara/signing/development.jks
          keytool -list -v -keystore AgendaClara/signing/development.jks -storepass android -alias agendaclara > certificado.txt
          if ! grep -q '92:32:F9:E8:BC:93:19:7D:2D:40:28:00:D1:1A:6C:10:27:B6:F2:F4:22:10:C4:F1:2E:A2:37:42:0D:F9:6E:B3' certificado.txt; then
            echo 'ERROR: la firma no coincide con el certificado de Agenda Clara 1.2.1.'
            exit 1
          fi
          rm -f certificado.txt

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Go para transporte WhatsApp
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Pruebas JVM de clasificación y contexto
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" "$SRC/QuickTaskVoiceParser.java" "$SRC/AcademicContextInterpreter.java" "$SRC/MultiActivityInterpreter.java"
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT"             "$SRC/WhatsAppUnderstandingEngine.java" "$SRC/ActivityClassifier.java" "$SRC/MessageParser.java"             "$SRC/ConversationAnalyzer.java" "$SRC/ConversationIntent.java" "$SRC/HistoryTextParser.java"             "$SRC/Task.java" "$SRC/TaskLogic.java" "$SRC/TaskExpiryPolicy.java"             "$SRC/DoubleTapGate.java" "$SRC/TextHash.java" "$SRC/TaskSummary.java"             AgendaClara/tests/CoreTests.java AgendaClara/tests/ConversationTests.java             updates/Phase3Tests.java updates/Phase4Tests.java
          # Pure Java daily metrics regressions; execute at the first approved build.
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" \
            "$SRC/Task.java" "$SRC/MiDiaDayMetrics.java" \
            updates/phase53/MiDiaDayMetricsTests.java
          java -cp "$OUT" pe.agendaclara.app.MiDiaDayMetricsTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" \
            "$SRC/ScheduleEntry.java" "$SRC/MiDiaNextClass.java" \
            updates/phase62/MiDiaNextClassTests.java
          java -cp "$OUT" pe.agendaclara.app.MiDiaNextClassTests
          java -cp "$OUT" CoreTests
          java -cp "$OUT" ConversationTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" updates/phase35/WhatsAppUnderstandingPrototypeTests.java
          java -cp "$OUT" WhatsAppUnderstandingPrototypeTests
          java -cp "$OUT" Phase3Tests
          java -cp "$OUT" Phase4Tests
          javac -encoding UTF-8 -d "$OUT" "$SRC/NotificationSummaryPolicy.java" updates/phase16/NotificationSummaryPolicyTest.java
          java -cp "$OUT" pe.agendaclara.app.NotificationSummaryPolicyTest
          javac -encoding UTF-8 -d "$OUT" "$SRC/SecureArchive.java" updates/phase5/Phase5Tests.java
          java -cp "$OUT" Phase5Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/TaskOrganization.java" "$SRC/AgendaFilters.java" "$SRC/ReviewFilters.java" updates/phase6/Phase6Tests.java
          java -cp "$OUT" Phase6Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/WeeklyPlanner.java" updates/phase7/Phase7Tests.java
          java -cp "$OUT" Phase7Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" AgendaClara/tests/Phase8Tests.java
          java -cp "$OUT" Phase8Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleEntry.java" "$SRC/ScheduleCourseColors.java" "$SRC/ScheduleParser.java" updates/phase10/ScheduleCoreTests.java
          java -cp "$OUT" ScheduleCoreTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleDayClock.java" updates/phase37/ScheduleDayClockTests.java
          java -cp "$OUT" ScheduleDayClockTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleGridInterpreter.java" updates/phase12/SchedulePhotoGridTests.java
          java -cp "$OUT" SchedulePhotoGridTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleConflict.java" "$SRC/SchedulePeriod.java" updates/phase11/ScheduleImprovementTests.java
          java -cp "$OUT" ScheduleImprovementTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleVirtualGrid.java" updates/phase13/Phase13CoreTest.java
          java -cp "$OUT" Phase13CoreTest
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleColorSpectrum.java" updates/phase14/ScheduleStage14Test.java
          java -cp "$OUT" ScheduleStage14Test
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleCourseRecognition.java" "$SRC/SchedulePhotoReview.java" updates/phase17/SchedulePhotoReviewTests.java
          java -cp "$OUT" SchedulePhotoReviewTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" updates/phase36/SchedulePhotoIntelligenceTests.java
          java -cp "$OUT" pe.agendaclara.app.SchedulePhotoIntelligenceTests

      - name: Pruebas JVM de comandos de voz y categoría General
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" "$SRC/QuickTaskVoiceParser.java" "$SRC/AcademicContextInterpreter.java" "$SRC/GeneralCategoryScope.java" updates/phase43/VoiceQuickTaskParserTests.java
          java -cp "$OUT" VoiceQuickTaskParserTests

      - name: Pruebas JVM de contexto académico y orden variable
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" "$SRC/QuickTaskVoiceParser.java" "$SRC/AcademicContextInterpreter.java" \
            "$SRC/MultiActivityInterpreter.java" "$SRC/MessageParser.java" "$SRC/ActivityClassifier.java" \
            "$SRC/WhatsAppUnderstandingEngine.java" "$SRC/ConversationAnalyzer.java" "$SRC/ConversationIntent.java" \
            "$SRC/Task.java" "$SRC/TaskLogic.java" "$SRC/TaskExpiryPolicy.java" "$SRC/HistoryTextParser.java" \
            "$SRC/TextHash.java" "$SRC/DoubleTapGate.java" updates/phase48/AcademicContextInterpreterTests.java
          java -cp "$OUT" AcademicContextInterpreterTests

      - name: Pruebas de marcadores de tareas y notas en calendario
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" "$SRC/Task.java" "$SRC/CalendarDaySummary.java" updates/phase44/CalendarDaySummaryTest.java
          java -cp "$OUT" CalendarDaySummaryTest

      - name: Pruebas JVM de lenguaje natural y fechas relativas
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" "$SRC/QuickTaskVoiceParser.java" "$SRC/AcademicContextInterpreter.java" updates/phase45/NaturalQuickTaskTests.java
          java -cp "$OUT" NaturalQuickTaskTests

      - name: Pruebas JVM de recuperación de ventanas al cerrar el teclado
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" "$SRC/DialogResizePolicy.java" updates/phase46/DialogResizePolicyTest.java
          java -cp "$OUT" pe.agendaclara.app.DialogResizePolicyTest

      - name: Preparar Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER" || { echo "Android SDK cmdline-tools no están disponibles"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'

      - name: Validar y reconstruir WhatsApp nativo
        shell: bash
        run: |
          set -euo pipefail
          cd AgendaClara/whatsapp-native
          GOTOOLCHAIN=local GOPROXY=off go test -mod=vendor -buildvcs=false ./...
          GOTOOLCHAIN=local GOPROXY=off go test -race -mod=vendor -buildvcs=false ./...
          cd ..
          ARM_BEFORE="$(sha256sum app/src/main/jniLibs/arm64-v8a/libagendawa.so | cut -d' ' -f1)"
          X86_BEFORE="$(sha256sum app/src/main/jniLibs/x86_64/libagendawa.so | cut -d' ' -f1)"
          python3 tools/build_whatsapp.py --go "$(command -v go)" --ndk "${ANDROID_HOME}/ndk/28.2.13676358"
          test -s app/src/main/jniLibs/arm64-v8a/libagendawa.so
          test -s app/src/main/jniLibs/x86_64/libagendawa.so
          test "$(sha256sum app/src/main/jniLibs/arm64-v8a/libagendawa.so | cut -d' ' -f1)" != "$ARM_BEFORE"
          test "$(sha256sum app/src/main/jniLibs/x86_64/libagendawa.so | cut -d' ' -f1)" != "$X86_BEFORE"

      - name: Preparar cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK Android
        working-directory: AgendaClara
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Validar estructura, firma y aplicación
        shell: bash
        run: |
          set -euo pipefail
          APK=AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -12
          echo "$BADGING" | grep -q "name='pe.agendaclara.app' versionCode='58' versionName='3.13.2'"
          echo "PASS: package pe.agendaclara.app, version 3.13.2 (58), signed Android APK"

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.13.2-APK
          path: AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Empaquetar fuentes verificadas sin firma
        shell: bash
        run: |
          set -euo pipefail
          rm -f AgendaClara/signing/development.jks
          rm -rf AgendaClara/.gradle AgendaClara/app/build AgendaClara/build
          zip -q -r Agenda-Clara-3.13.2-Fuentes-Verificadas.zip AgendaClara -x 'AgendaClara/signing/*' 'AgendaClara/*.jks' 'AgendaClara/*.keystore'
          if unzip -Z1 Agenda-Clara-3.13.2-Fuentes-Verificadas.zip | grep -Eq '\.(jks|keystore)$'; then exit 1; fi
      - name: Publicar fuentes 3.13.1
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.13.2-Fuentes-Verificadas
          path: Agenda-Clara-3.13.2-Fuentes-Verificadas.zip
          retention-days: 30
          if-no-files-found: error

  prueba-android-emulador:
    needs: construir-y-validar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtener pruebas de interfaz
        uses: actions/checkout@v4
      - name: Recuperar APK compilada
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-3.13.2-APK
          path: artifact-apk
      - name: Preparar aceleración para emulador
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Probar instalación y navegación en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: agenda-clara-ui
          disable-animations: true
          script: bash updates/phase67/emulator_header_qa.sh && bash updates/phase62/emulator_responsive_qa.sh && bash updates/phase16/emulator_3_8.sh && bash updates/phase51/emulator_mi_dia_qa.sh && bash updates/phase44/emulator_calendar_visual_qa.sh && python3 updates/phase46/emulator_keyboard_restore_qa.py && python3 updates/phase47/emulator_widget_floating_qa.py
      - name: Publicar capturas sintéticas del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.13.1-Emulator-Capturas
          path: screenshots/
          if-no-files-found: ignore

  publicar-apk-fase19:
    needs: [construir-y-validar, prueba-android-emulador]
    if: github.ref == 'refs/heads/feat/mi-dia-header-15-19-validated-apk' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Recuperar APK firmada y verificada
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-3.13.2-APK
          path: artifact-apk
      - name: Publicar archivo APK descargable en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -s artifact-apk/app-debug.apk
          mkdir -p dist
          cp artifact-apk/app-debug.apk dist/Agenda-Clara-3.13.1-Mi-Dia.apk
          sha256sum dist/Agenda-Clara-3.13.1-Mi-Dia.apk
          TAG='v3.13.1-encabezado-sin-numeros'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Agenda-Clara-3.13.1-Mi-Dia.apk \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Agenda-Clara-3.13.1-Mi-Dia.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Agenda Clara 3.13.1 · Encabezado limpio (fases 15–19)' \
              --notes 'APK 3.13.1: eliminadas las insignias numéricas de los 30 paisajes, fundidos superior/inferior del encabezado; 50 frases motivadoras conservadas. Build y pruebas Android superadas antes de esta publicación. Se recomienda guardar copia de seguridad de los datos antes de actualizar.' \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
