# Único flujo vigente de compilación, pruebas JVM y emulador Android.
name: Agenda Clara 3.13.2 · Compilación y validación de iconografía
on:
  push:
    branches: [main, feat/iconografia-fase26-27-apk-20261104, feat/mi-dia-header-15-19-validated-apk, feat/mi-dia-class-schedule-home-v2-no-build, feat/mi-dia-phases-6-8-no-build, feat/top-plus-png-motion-3-8-2, feat/remove-compose-daily-view-3-8-2, feat/full-ui-categories-responsive-3-8-2, feat/category-only-agenda-navigation-3-8-2, feat/reference-iconography-branded-pickers-3-8-2, feat/png-approved-icons-symbol-color-pickers-3-8-2, feat/restore-nav-icons-performance-cleanup-3-8-2, feat/sticky-notes-plus-menu-3-9-0, feat/sticky-notes-home-widget-3-9-1, fix/category-selected-png-icons-3-9-2, feat/polished-sticky-art-3-9-3, feat/sticky-responsive-accessibility-3-9-4, feat/whatsapp-context-understanding-3-9-5, feat/schedule-photo-course-reconciliation-3-9-6, feat/schedule-per-day-12h-3-9-7, feat/calendar-png-today-schedule-3-9-8, feat/calendar-clean-transparent-png-3-9-9, restore/whatsapp-two-stage-300ms-3-10-3, fix/whatsapp-session-retry-3-10-4, fix/whatsapp-final-hardening-3-10-5, feat/voice-quick-task-general-catalog-3-10-6, feat/calendar-visual-task-note-3-10-7, feat/voice-natural-language-3-10-8, fix/calendar-remove-week-dialog-keyboard-3-10-9, feat/widget-floating-voice-manual-3-11-0, feat/academic-context-order-3-11-1, feat/white-widgets-preserve-icons-3-11-2, feat/widget-icons-waves-3-11-3]
    paths:
      - 'updates/**'
      - 'Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip'
      - '.github/workflows/agenda-clara-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'updates/**'
      - 'Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip'
      - '.github/workflows/agenda-clara-ci.yml'
  workflow_dispatch:

concurrency:
  group: agenda-clara-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construir-y-validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivo de fuentes sin clave
        shell: bash
        run: |
          set -euo pipefail
          test -s Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip
          unzip -t Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip | tail -1
          if unzip -Z1 Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip | grep -Eq '\.(jks|keystore)$'; then
            echo 'ERROR: No publiques archivos de firma en el repositorio.'
            exit 1
          fi
          unzip -q Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip
          test -s AgendaClara/gradlew
          test -s AgendaClara/app/build.gradle
          test -s AgendaClara/gradle/wrapper/gradle-wrapper.jar
          python3 updates/apply_1_3_1.py
          python3 AgendaClara/tests/test_cleanup_sqlite.py
          python3 updates/test_1_3_1.py
          python3 updates/apply_1_4_0.py
          python3 updates/test_1_4_0.py
          python3 updates/apply_1_5_0.py
          python3 updates/apply_2_0_0.py
          python3 updates/test_2_0_0.py
          python3 updates/apply_2_1_0.py
          python3 updates/test_2_1_0.py
          python3 updates/apply_2_2_0.py
          python3 updates/test_2_2_0.py
          python3 updates/apply_2_3_0.py
          python3 updates/test_2_3_0.py
          python3 updates/apply_2_4_0.py
          python3 updates/apply_2_5_0.py
          python3 updates/test_2_5_0.py
          python3 updates/apply_2_6_0.py
          python3 updates/apply_2_6_1.py
          python3 updates/apply_2_7_0.py
          python3 updates/apply_2_8_0.py
          python3 updates/apply_2_9_0.py
          python3 updates/apply_3_0_0.py
          python3 updates/apply_3_1_0.py
          python3 updates/apply_3_2_0.py
          python3 updates/apply_3_3_0.py
          python3 updates/apply_3_4_0.py
          python3 updates/apply_3_5_0.py
          python3 updates/apply_3_6_0.py
          python3 updates/apply_3_7_0.py
          python3 updates/interpretation/apply.py
          python3 updates/phase15/apply_3_7_1.py
          python3 updates/phase15/test_3_7_1.py
          python3 updates/test_3_7_0.py
          python3 updates/test_3_6_0.py
          python3 updates/phase16/apply_3_8_0.py
          python3 updates/phase16/test_3_8_0.py
          python3 updates/phase17/apply_3_8_1.py
          python3 updates/phase17/test_3_8_1.py
          python3 updates/phase18/apply_3_8_2.py
          python3 updates/phase18/test_3_8_2.py
          python3 updates/phase30/apply_3_9_0.py
          python3 updates/phase30/test_3_9_0.py
          python3 updates/phase31/apply_3_9_1.py
          python3 updates/phase31/test_3_9_1.py
          python3 updates/phase32/apply_3_9_2.py
          python3 updates/phase32/test_3_9_2.py
          python3 updates/phase33/apply_3_9_3.py
          python3 updates/phase33/test_3_9_3.py
          python3 updates/phase34/apply_3_9_4.py
          python3 updates/phase34/test_3_9_4.py
          python3 updates/phase35/apply_3_9_5.py
          python3 updates/phase35/test_3_9_5.py
          python3 updates/phase36/apply_3_9_6.py
          python3 updates/phase36/test_3_9_6.py
          python3 updates/phase37/apply_3_9_7.py
          python3 updates/phase37/test_3_9_7.py
          python3 updates/phase38/apply_3_9_8.py
          python3 updates/phase38/test_3_9_8.py
          python3 updates/phase39/apply_3_9_9.py
          python3 updates/phase39/test_3_9_9.py
          python3 updates/phase40/apply_restore_3_10_3.py
          python3 updates/phase40/test_restore_3_10_3.py
          python3 updates/phase41/apply_whatsapp_connection_fix.py
          python3 updates/phase41/test_whatsapp_connection_fix.py
          python3 updates/phase42/apply_whatsapp_hardening.py
          python3 updates/phase42/test_whatsapp_hardening.py
          python3 updates/phase43/apply_voice_quick_task.py
          python3 updates/phase43/test_voice_quick_task.py
          python3 updates/phase43/install_vosk_es.py
          python3 updates/phase44/apply_calendar_visual.py
          python3 updates/phase44/test_calendar_visual.py
