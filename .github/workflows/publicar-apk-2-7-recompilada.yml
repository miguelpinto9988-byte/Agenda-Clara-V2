name: Publicar nueva descarga Agenda Clara 2.7.0 recompilada
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-apk-2-7-recompilada.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Descargar APK de nueva compilación verificada
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-2.7.0-APK
          run-id: 40057922432
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Validar paquete y generar alternativa de descarga
        shell: bash
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          echo '1dc850657c387e1c64e51493193b73ea3dcabfdd1ce50f5f54d043ed6782aa07  apk/app-debug.apk' | sha256sum --check
          unzip -t apk/app-debug.apk | tail -1
          mv apk/app-debug.apk apk/AgendaClara_2_7_RECOMPILADA.apk
          printf 'Agenda Clara 2.7.0 recompilada y validada en Android 15.\nInstala sobre la versión existente SIN desinstalarla.\nSHA256: 1dc850657c387e1c64e51493193b73ea3dcabfdd1ce50f5f54d043ed6782aa07\n' > apk/LEEME.txt
          (cd apk && zip -q -9 AgendaClara_2_7_RECOMPILADA_Alternativa.zip AgendaClara_2_7_RECOMPILADA.apk LEEME.txt)
      - name: Publicar enlace nuevo y estable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload v2.7.0 apk/AgendaClara_2_7_RECOMPILADA.apk apk/AgendaClara_2_7_RECOMPILADA_Alternativa.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release view v2.7.0 --repo "$GITHUB_REPOSITORY" --json url,assets
