name: Agenda Clara 3.14.0 - QA sílabos
on:
  push:
    branches: [feat/silabos-fases-restantes-3-14-0-20261105]
    paths: ['updates/phase80/**', '.github/workflows/agenda-clara-syllabus-3140-source.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar fuentes 3.13.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42104750703 --repo "$GITHUB_REPOSITORY" --name Agenda-Clara-3.13.9-Silabos-Revisados-Fuentes --dir previous
          unzip -q previous/Agenda-Clara-3.13.9-Silabos-Revisados-Fuentes.zip
      - name: Integrar
        run: python3 updates/phase80/apply_remaining_syllabus.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probar
        run: |
          set -e
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" "$SRC/AcademicCourseMatcher.java" "$SRC/SyllabusDateInterpreter.java" "$SRC/SyllabusEventParser.java" "$SRC/SyllabusReviewIntelligence.java" "$SRC/SyllabusTableInterpreter.java" "$SRC/SyllabusImportPipeline.java" "$SRC/SyllabusRevisionComparator.java" updates/phase79/Phase79ReviewTests.java updates/phase80/Phase80Tests.java
          java -cp "$OUT" pe.agendaclara.app.Phase79ReviewTests
          java -cp "$OUT" pe.agendaclara.app.Phase80Tests
