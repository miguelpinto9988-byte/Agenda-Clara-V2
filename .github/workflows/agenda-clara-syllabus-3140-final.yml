name: Agenda Clara 3.14.0 - Sílabos revisados - APK y Android
on:
  push:
    branches: [feat/silabos-fases-restantes-3-14-0-20261105]
    paths:
      - '.github/workflows/agenda-clara-syllabus-3140-final.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: agenda-clara-syllabus-3140
  cancel-in-progress: true
jobs:
  construir-y-probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar fuentes verificadas de Agenda Clara 3.13.8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 42104750703 --repo "$GITHUB_REPOSITORY" \
            --name Agenda-Clara-3.13.9-Silabos-Revisados-Fuentes --dir previous
          unzip -q previous/Agenda-Clara-3.13.9-Silabos-Revisados-Fuentes.zip
      - name: Aplicar fases A, B y C
        run: |
          set -euo pipefail
          python3 updates/phase80/apply_remaining_syllabus.py
          grep -q 'SyllabusImportPipeline.extract' AgendaClara/app/src/main/java/pe/agendaclara/app/SyllabusImportActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar reglas académicas sin Android
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" \
            "$SRC/AcademicCourseMatcher.java" \
            "$SRC/SyllabusDateInterpreter.java" \
            "$SRC/SyllabusEventParser.java" \
            "$SRC/SyllabusReviewIntelligence.java" \
            "$SRC/SyllabusTableInterpreter.java" \
            "$SRC/SyllabusImportPipeline.java" \
            "$SRC/SyllabusRevisionComparator.java" \
            updates/phase79/Phase79ReviewTests.java \
            updates/phase80/Phase80Tests.java
          java -cp "$OUT" pe.agendaclara.app.Phase79ReviewTests\n          java -cp "$OUT" pe.agendaclara.app.Phase80Tests
      - name: Recuperar firma privada de desarrollo
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_JKS_BASE64"
          mkdir -p AgendaClara/signing
          printf '%s' "$SIGNING_JKS_BASE64" | base64 -d > AgendaClara/signing/development.jks
          chmod 600 AgendaClara/signing/development.jks
          keytool -list -keystore AgendaClara/signing/development.jks -storepass android -alias agendaclara >/dev/null
      - name: Preparar Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK 3.14.0
        working-directory: AgendaClara
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Verificar firma y versión
        run: |
          set -euo pipefail
          APK=AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "name='pe.agendaclara.app' versionCode='66' versionName='3.14.0'"
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.14.0-Silabos-Revisados-APK
          path: AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Guardar fuentes reconstruidas sin firma
        run: |
          set -euo pipefail
          rm -f AgendaClara/signing/development.jks
          rm -rf AgendaClara/.gradle AgendaClara/app/build AgendaClara/build
          zip -q -r Agenda-Clara-3.14.0-Silabos-Revisados-Fuentes.zip AgendaClara -x 'AgendaClara/signing/*' 'AgendaClara/*.jks'
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.14.0-Silabos-Revisados-Fuentes
          path: Agenda-Clara-3.14.0-Silabos-Revisados-Fuentes.zip
          retention-days: 30
  verificar-android:
    needs: construir-y-probar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-3.14.0-Silabos-Revisados-APK
          path: artifact-apk
      - name: Habilitar KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verificar arranque y navegación Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          avd-name: agenda-clara-syllabus-3140
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim\n          script: |
            adb install -r artifact-apk/app-debug.apk
            adb shell am start -n pe.agendaclara.app/.MainActivity
            sleep 9
            adb shell pidof pe.agendaclara.app
            adb shell dumpsys activity activities | grep -q pe.agendaclara.app\n            echo 'PASS: aplicación instalada y abierta en Android 15; flujo PDF aún no verificado'
            adb shell pidof pe.agendaclara.app
