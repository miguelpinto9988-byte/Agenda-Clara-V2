name: Agenda Clara · 500 íconos PNG Full HD
on:
  push:
    branches: [feat/icon-library-500-fullhd-reflections]
    paths:
      - 'updates/phase53/**'
      - '.github/workflows/icon-library-500.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biblioteca-500:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Reconstruir catálogo premium 328
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-png
          python updates/phase51/generate_icons.py generated-png
          python updates/phase52/generate_adaptive_pro.py generated-png icon_pro_artifacts
      - name: Preparar biblioteca Android aislada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AgendaClara/app/src/main/res/drawable-nodpi
          mkdir -p AgendaClara/app/src/main/assets/licenses
          mkdir -p AgendaClara/app/src/main/java/pe/agendaclara/app
          cp generated-png/ic_adapt_*.png AgendaClara/app/src/main/res/drawable-nodpi/
          cp icon_pro_artifacts/MANIFEST.json AgendaClara/app/src/main/assets/adaptive_icon_sources.json
          cp icon_pro_artifacts/LICENSE-MIT.txt AgendaClara/app/src/main/assets/licenses/microsoft-fluent-emoji-MIT.txt
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('AgendaClara/app/src/main')
          src=json.loads((base/'assets/adaptive_icon_sources.json').read_text())
          data={'count':328,'png_bytes':src['png_bytes'],'icons':{e['key']:{'file':e['filename'],'family':'premium'} for e in src['icons']}}
          (base/'assets/adaptive_icon_catalog.json').write_text(json.dumps(data,ensure_ascii=False),encoding='utf8')
          PY
      - name: Crear 500 íconos optimizados Android
        run: python updates/phase53/build_500.py --mode mobile
      - name: Validación estricta de 500 PNG Android
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json
          files=sorted(Path('AgendaClara/app/src/main/res/drawable-nodpi').glob('ic_adapt_*.png'))
          assert len(files)==500,len(files)
          digests=set()
          for f in files:
              with Image.open(f) as im:
                  assert im.size==(256,256),f
                  assert im.mode in ('RGBA','P'),f
                  assert im.convert('RGBA').getpixel((0,0))[3]==0,f
              digests.add(hashlib.sha256(f.read_bytes()).hexdigest())
          assert len(digests)==500,len(digests)
          doc=json.loads(Path('icon_library_500/MANIFEST-256.json').read_text())
          assert doc['count']==500 and doc['new_icons']==172
          print('PASS: 500 PNG Android 256 px, 500 hashes distintos, transparencia y nomenclatura verificadas')
          PY
      - name: Crear 500 originales Full HD 2048
        run: python updates/phase53/build_500.py --mode fullhd
      - name: Verificar masters y producir catálogo visual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import hashlib,json
          root=Path('icon_library_500')
          files=sorted((root/'FULLHD-2048').glob('ic_adapt_*.png'))
          assert len(files)==500,len(files)
          hashes=set()
          for f in files:
              with Image.open(f) as im:
                  assert im.size==(2048,2048),f
                  assert im.convert('RGBA').getpixel((0,0))[3]==0,f
              hashes.add(hashlib.sha256(f.read_bytes()).hexdigest())
          assert len(hashes)==500,len(hashes)
          pick=[f for f in files if any(s in f.stem for s in ('voice_mic','calendar_today','new_task','new_note','notify_urgent','exam_review'))][:6]
          gallery=Image.new('RGB',(1200,800),'#f5f6fa')
          for i,f in enumerate(pick):
              with Image.open(f) as im:
                  im=im.convert('RGBA')
                  im.thumbnail((310,310),Image.Resampling.LANCZOS)
                  x=(i%3)*400+45;y=(i//3)*400+45
                  gallery.paste(im,(x,y),im)
          gallery.save(root/'MUESTRA-500.png')
          print('PASS: 500 PNG 2048x2048, hashes distintos y transparencias')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-500-Iconos-FullHD-2048
          path: |
            icon_library_500/Agenda-Clara-500-Iconos-FullHD-2048.zip
            icon_library_500/MANIFEST-2048.json
            icon_library_500/MUESTRA-500.png
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-500-Iconos-Android-256
          path: |
            AgendaClara/app/src/main/res/drawable-nodpi/ic_adapt_*.png
            icon_library_500/MANIFEST-256.json
          retention-days: 30
          if-no-files-found: error
