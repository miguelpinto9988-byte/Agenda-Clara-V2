name: Agenda Clara 3.15.6 - Widgets y OCR fotografia verificados
on:
  push:
    branches: [main, fix/adaptive-photo-learning-3156-20261106]
    paths:
      - 'updates/phase82/**'
      - 'updates/phase83/**'
      - 'updates/phase84/**'
      - 'updates/phase85/**'
      - 'updates/phase86/**'
      - 'updates/phase87/**'
      - '.github/workflows/agenda-clara-ocr-photo-3151.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: agenda-clara-widgets-photo-3156-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compilar-y-probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar fuentes 3.15.0 verificadas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42145182419 --repo "$GITHUB_REPOSITORY" \
            --name Agenda-Clara-3.15.0-Widgets-Academicos-Fuentes --dir previous
          unzip -q previous/Agenda-Clara-3.15.0-Widgets-Academicos-Fuentes.zip
          test -s AgendaClara/app/src/main/java/pe/agendaclara/app/ScheduleActivity.java
      - name: Aplicar política de confirmación a cursos leídos por foto
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile updates/phase82/*.py
          python3 updates/phase82/apply_photo_course_confirmation.py
          python3 updates/phase82/qa_photo_course_confirmation.py
      - name: Aplicar sincronización fiable de widgets y proteger fotografía fija
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile updates/phase83/apply_widget_refresh_3152.py
          python3 updates/phase83/test_widget_patch.py -v
          python3 updates/phase83/apply_widget_refresh_3152.py
      - name: Corregir clases XML incompatibles con RemoteViews y probar sus proveedores
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile updates/phase84/*.py
          python3 updates/phase84/apply_widget_remoteviews_fix.py
          python3 updates/phase84/qa_widget_remoteviews.py
          python3 updates/phase84/install_widget_render_probe.py
      - name: Aplicar lector contextual de sílabos 3.15.6 sin alterar widgets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile updates/phase85/*.py
          python3 updates/phase85/apply_contextual_syllabus.py
      - name: Mejorar OCR de fotografías con análisis semántico y auditoría interna
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile updates/phase86/*.py
          python3 updates/phase86/apply_photo_semantics_3156.py
          grep -q 'reviewSavedCourseNames' AgendaClara/app/src/main/java/pe/agendaclara/app/ScheduleActivity.java
          grep -q 'confirmPhotoGroupSummary' AgendaClara/app/src/main/java/pe/agendaclara/app/ScheduleActivity.java
      - name: Instalar memoria adaptativa y comprobar migración segura
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile updates/phase87/*.py
          python3 updates/phase87/qa_adaptive_patch.py
          python3 updates/phase87/apply_adaptive_photo_3156.py
          python3 updates/phase87/apply_adaptive_photo_3156.py
          test -s AgendaClara/app/src/main/java/pe/agendaclara/app/ScheduleAdaptiveMemory.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pruebas del lector inferencial y regresiones históricas del sílabo
        run: bash updates/phase85/qa_contextual_syllabus.sh
      - name: Verificar selección de horarios, cursos, tareas y evaluaciones por perfil
        run: bash updates/phase81/qa_widget_models.sh
      - name: Probar asociación de widgets con datos de prueba
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          javac -encoding UTF-8 -d "$OUT" \
            updates/phase81/AcademicWidgetModels.java \
            updates/phase83/Phase83WidgetDataTests.java
          java -cp "$OUT" pe.agendaclara.app.Phase83WidgetDataTests
      - name: Comprobar orden cronológico global de evaluaciones de diferentes cursos
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          javac -encoding UTF-8 -d "$OUT" \
            AgendaClara/app/src/main/java/pe/agendaclara/app/Task.java \
            AgendaClara/app/src/main/java/pe/agendaclara/app/AcademicWidgetEvaluationOrder.java \
            updates/phase83/AcademicWidgetEvaluationOrderTests.java
          java -cp "$OUT" pe.agendaclara.app.AcademicWidgetEvaluationOrderTests
          grep -q 'AcademicWidgetEvaluationOrder.ordered(orderedEntries,startOfToday)' \
            AgendaClara/app/src/main/java/pe/agendaclara/app/AcademicWeekWidget.java
      - name: Probar refresco concurrente de los widgets académicos
        run: bash updates/phase83/qa_widget_sync.sh
      - name: Comprobar aprendizaje adaptativo basado en decisiones confirmadas
        shell: bash
        run: |
          set -euo pipefail
          DIR=AgendaClara/app/src/main/java/pe/agendaclara/app
          OUT="$(mktemp -d)"
          javac -encoding UTF-8 -d "$OUT" \
            "$DIR/ScheduleEntry.java" \
            "$DIR/ScheduleCourseColors.java" \
            "$DIR/ScheduleCourseRecognition.java" \
            "$DIR/ScheduleCourseSemanticGuard.java" \
            "$DIR/ScheduleAdaptiveRules.java" \
            updates/phase87/Phase87AdaptiveTests.java
          java -cp "$OUT" pe.agendaclara.app.Phase87AdaptiveTests
      - name: Probar coincidencia de una sola palabra y variantes OCR
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          DIR=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT" \
            "$DIR/ScheduleEntry.java" \
            "$DIR/ScheduleCourseColors.java" \
            "$DIR/ScheduleCourseRecognition.java" \
            "$DIR/ScheduleParser.java" \
            "$DIR/ScheduleGridInterpreter.java" \
            "$DIR/SchedulePhotoReview.java" \
            "$DIR/ScheduleCourseSemanticGuard.java" \
            "$DIR/ScheduleVirtualGrid.java" \
            "$DIR/ScheduleOcrFusion.java" \
            updates/phase82/Phase82PhotoCourseTests.java \
            updates/phase86/Phase86SemanticPhotoTests.java \
            updates/phase76/Phase76RecognitionTests.java \
            updates/phase77/Phase77FusionTests.java
          java -cp "$OUT" pe.agendaclara.app.Phase82PhotoCourseTests
          java -cp "$OUT" pe.agendaclara.app.Phase86SemanticPhotoTests
          java -cp "$OUT" pe.agendaclara.app.Phase76RecognitionTests
          java -cp "$OUT" pe.agendaclara.app.Phase77FusionTests
      - name: Recuperar firma de desarrollo
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_JKS_BASE64"
          mkdir -p AgendaClara/signing
          printf '%s' "$SIGNING_JKS_BASE64" | base64 -d > AgendaClara/signing/development.jks
          chmod 600 AgendaClara/signing/development.jks
          keytool -list -keystore AgendaClara/signing/development.jks -storepass android -alias agendaclara >/dev/null
      - name: Preparar Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK 3.15.6
        working-directory: AgendaClara
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Verificar firma y paquete
        run: |
          set -euo pipefail
          APK=AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q ScheduleActivity
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "name='pe.agendaclara.app' versionCode='73' versionName='3.15.6'"
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.15.6-Widgets-OCR-Foto-APK
          path: AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Guardar fuentes reconstruidas sin firma
        run: |
          rm -f AgendaClara/signing/development.jks
          rm -rf AgendaClara/.gradle AgendaClara/app/build AgendaClara/build
          zip -q -r Agenda-Clara-3.15.6-Widgets-OCR-Foto-Fuentes.zip AgendaClara -x 'AgendaClara/signing/*' 'AgendaClara/*.jks'
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.15.6-Widgets-OCR-Foto-Fuentes
          path: Agenda-Clara-3.15.6-Widgets-OCR-Foto-Fuentes.zip
          retention-days: 30
  android:
    needs: compilar-y-probar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-3.15.6-Widgets-OCR-Foto-APK
          path: artifact-apk
      - name: Habilitar KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Instalar y abrir en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          avd-name: agenda-clara-3156-widgets-photo
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r artifact-apk/app-debug.apk
            adb shell am start -n pe.agendaclara.app/.MainActivity
            sleep 8
            adb shell pidof pe.agendaclara.app
            adb shell pidof pe.agendaclara.app
            adb shell dumpsys package pe.agendaclara.app | grep -q AcademicDayWidget
            adb shell dumpsys package pe.agendaclara.app | grep -q AcademicWeekWidget
            adb shell dumpsys package pe.agendaclara.app | grep -q PhotoWidget
            echo 'PASS: APK 3.15.6 opens with academic and photo widget providers'
            adb logcat -c
            adb shell am start -n pe.agendaclara.app/.WidgetRenderProbeActivity
            sleep 5
            adb logcat -d -s AgendaWidgetQA:I '*:S' > widget_render.log
            cat widget_render.log
            grep -Fq 'PASS: 13/13 widget XML layouts inflated with RemoteViews.apply' widget_render.log
            echo 'PASS: all 13 XML widget layouts render successfully on Android 15'
