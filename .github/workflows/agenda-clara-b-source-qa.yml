name: Agenda Clara - Entrega B - QA de fuentes sin APK
on:
  push:
    branches: [feat/plan-estudio-entrega-b-20261104]
    paths:
      - 'updates/phase72/**'
      - '.github/workflows/agenda-clara-b-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-fuentes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Revisar scripts y enlaces de funcionalidades
        run: python3 updates/phase72/test_plan_b.py
      - name: Preparar Java 17 solo para pruebas JVM
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probar reconocimiento de cursos y fechas sin Android
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          javac -encoding UTF-8 -d "$OUT"             updates/phase72/AcademicCourseMatcher.java             updates/phase72/SyllabusEventParser.java             updates/phase72/PhaseBParserTests.java
          java -cp "$OUT" pe.agendaclara.app.PhaseBParserTests
          echo 'PASS: solo pruebas JVM; NO Gradle, NO APK, NO firma'
