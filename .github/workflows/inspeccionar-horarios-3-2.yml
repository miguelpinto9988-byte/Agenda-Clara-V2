name: Inspeccionar selector de dias 3.2
on:
  push:
    paths:
      - 'updates/inspect_3_2_days.py'
      - '.github/workflows/inspeccionar-horarios-3-2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituir fuentes y mostrar editor
        shell: bash
        run: |
          unzip -q Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip
          python3 updates/apply_1_3_1.py
          python3 updates/apply_1_4_0.py
          python3 updates/apply_1_5_0.py
          python3 updates/apply_2_0_0.py
          python3 updates/apply_2_1_0.py
          python3 updates/apply_2_2_0.py
          python3 updates/apply_2_3_0.py
          python3 updates/apply_2_4_0.py
          python3 updates/apply_2_5_0.py
          python3 updates/apply_2_6_0.py
          python3 updates/apply_2_6_1.py
          python3 updates/apply_2_7_0.py
          python3 updates/apply_2_8_0.py
          python3 updates/apply_2_9_0.py
          python3 updates/apply_3_0_0.py
          python3 updates/apply_3_1_0.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('AgendaClara/app/src/main/java/pe/agendaclara/app/ScheduleActivity.java').read_text()
          i=s.index('private void editor(')
          print('=== EDITOR FULL ===')
          print(s[i:i+15000])
          print('=== REVIEW ===')
          for needle in ('private void review','private void showReview','private void showDetected'):
              if needle in s:print(s[s.index(needle):s.index(needle)+6000])
          PY