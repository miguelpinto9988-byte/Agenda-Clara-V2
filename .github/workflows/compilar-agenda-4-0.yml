# Nueva recompilación verificada de Agenda Clara 2.7.0 solicitada por el usuario.
name: Compilar Agenda Clara 4.0.0 Google Calendar por cuenta y horario
on:
  push:
    branches: [main]
    paths:
      - 'updates/apply_2_6_0.py'
      - 'updates/apply_2_6_1.py'
      - 'updates/apply_2_7_0.py'
      - 'updates/apply_2_8_0.py'
      - 'updates/apply_2_9_0.py'
      - 'updates/apply_3_0_0.py'
      - 'updates/apply_3_1_0.py'
      - 'updates/apply_3_2_0.py'
      - 'updates/apply_3_3_0.py'
      - 'updates/apply_3_4_0.py'
      - 'updates/apply_3_5_0.py'
      - 'updates/apply_3_6_0.py'
      - 'updates/apply_3_7_0.py'
      - 'updates/apply_3_8_0.py'
      - 'updates/apply_3_9_0.py'
      - 'updates/apply_4_0_0.py'
      - 'updates/test_3_6_0.py'
      - 'updates/test_3_7_0.py'
      - 'updates/test_3_6_0.py'
      - 'updates/phase13/**'
      - 'updates/phase14/**'
      - 'updates/phase12/**'
      - 'updates/phase11/**'
      - 'updates/phase10/**'
      - '.github/workflows/compilar-agenda-4-0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir-y-validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivo de fuentes sin clave
        shell: bash
        run: |
          set -euo pipefail
          test -s Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip
          unzip -t Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip | tail -1
          if unzip -Z1 Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip | grep -Eq '\.(jks|keystore)$'; then
            echo 'ERROR: No publiques archivos de firma en el repositorio.'
            exit 1
          fi
          unzip -q Agenda-Clara-1.3.0-Fuentes-Sin-Clave.zip
          test -s AgendaClara/gradlew
          test -s AgendaClara/app/build.gradle
          test -s AgendaClara/gradle/wrapper/gradle-wrapper.jar
          python3 updates/apply_1_3_1.py
          python3 AgendaClara/tests/test_cleanup_sqlite.py
          python3 updates/test_1_3_1.py
          python3 updates/apply_1_4_0.py
          python3 updates/test_1_4_0.py
          python3 updates/apply_1_5_0.py
          python3 updates/apply_2_0_0.py
          python3 updates/test_2_0_0.py
          python3 updates/apply_2_1_0.py
          python3 updates/test_2_1_0.py
          python3 updates/apply_2_2_0.py
          python3 updates/test_2_2_0.py
          python3 updates/apply_2_3_0.py
          python3 updates/test_2_3_0.py
          python3 updates/apply_2_4_0.py
          python3 updates/apply_2_5_0.py
          python3 updates/test_2_5_0.py
          python3 updates/apply_2_6_0.py
          python3 updates/apply_2_6_1.py
          python3 updates/apply_2_7_0.py
          python3 updates/apply_2_8_0.py
          python3 updates/apply_2_9_0.py
          python3 updates/apply_3_0_0.py
          python3 updates/apply_3_1_0.py
          python3 updates/apply_3_2_0.py
          python3 updates/apply_3_3_0.py
          python3 updates/apply_3_4_0.py
          python3 updates/apply_3_5_0.py
          python3 updates/apply_3_6_0.py
          python3 updates/apply_3_7_0.py
          python3 updates/apply_3_8_0.py
          python3 updates/apply_3_9_0.py
          python3 updates/apply_4_0_0.py
          python3 updates/test_3_7_0.py
          python3 updates/test_3_6_0.py

      - name: Recuperar clave de desarrollo privada
        shell: bash
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_JKS_BASE64" ]; then
            echo 'ERROR: Configura el secreto de GitHub Actions SIGNING_JKS_BASE64.'
            exit 1
          fi
          mkdir -p AgendaClara/signing
          printf '%s' "$SIGNING_JKS_BASE64" | base64 -d > AgendaClara/signing/development.jks
          chmod 600 AgendaClara/signing/development.jks
          keytool -list -v -keystore AgendaClara/signing/development.jks -storepass android -alias agendaclara > certificado.txt
          if ! grep -q '92:32:F9:E8:BC:93:19:7D:2D:40:28:00:D1:1A:6C:10:27:B6:F2:F4:22:10:C4:F1:2E:A2:37:42:0D:F9:6E:B3' certificado.txt; then
            echo 'ERROR: la firma no coincide con el certificado de Agenda Clara 1.2.1.'
            exit 1
          fi
          rm -f certificado.txt

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pruebas JVM de clasificación y contexto
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          SRC=AgendaClara/app/src/main/java/pe/agendaclara/app
          javac -encoding UTF-8 -d "$OUT"             "$SRC/ActivityClassifier.java" "$SRC/MessageParser.java"             "$SRC/ConversationAnalyzer.java" "$SRC/ConversationIntent.java" "$SRC/HistoryTextParser.java"             "$SRC/Task.java" "$SRC/TaskLogic.java" "$SRC/TaskExpiryPolicy.java"             "$SRC/DoubleTapGate.java" "$SRC/TextHash.java" "$SRC/TaskSummary.java"             AgendaClara/tests/CoreTests.java AgendaClara/tests/ConversationTests.java             updates/Phase3Tests.java updates/Phase4Tests.java
          java -cp "$OUT" CoreTests
          java -cp "$OUT" ConversationTests
          java -cp "$OUT" Phase3Tests
          java -cp "$OUT" Phase4Tests
          javac -encoding UTF-8 -d "$OUT" "$SRC/SecureArchive.java" updates/phase5/Phase5Tests.java
          java -cp "$OUT" Phase5Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/TaskOrganization.java" "$SRC/AgendaFilters.java" "$SRC/ReviewFilters.java" updates/phase6/Phase6Tests.java
          java -cp "$OUT" Phase6Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/WeeklyPlanner.java" updates/phase7/Phase7Tests.java
          java -cp "$OUT" Phase7Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" AgendaClara/tests/Phase8Tests.java
          java -cp "$OUT" Phase8Tests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleEntry.java" "$SRC/ScheduleCourseColors.java" "$SRC/ScheduleParser.java" updates/phase10/ScheduleCoreTests.java
          java -cp "$OUT" ScheduleCoreTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleGridInterpreter.java" updates/phase12/SchedulePhotoGridTests.java
          java -cp "$OUT" SchedulePhotoGridTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleConflict.java" "$SRC/SchedulePeriod.java" updates/phase11/ScheduleImprovementTests.java
          java -cp "$OUT" ScheduleImprovementTests
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleVirtualGrid.java" updates/phase13/Phase13CoreTest.java
          java -cp "$OUT" Phase13CoreTest
          javac -encoding UTF-8 -cp "$OUT" -d "$OUT" "$SRC/ScheduleColorSpectrum.java" updates/phase14/ScheduleStage14Test.java
          java -cp "$OUT" ScheduleStage14Test

      - name: Preparar Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER" || { echo "Android SDK cmdline-tools no están disponibles"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Preparar cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK Android
        working-directory: AgendaClara
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Validar estructura, firma y aplicación
        shell: bash
        run: |
          set -euo pipefail
          APK=AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -12
          echo "$BADGING" | grep -q "name='pe.agendaclara.app' versionCode='30' versionName='4.0.0'"
          echo "PASS: package pe.agendaclara.app, version 4.0.0 (29), signed Android APK"

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-4.0.0-APK
          path: AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Empaquetar fuentes verificadas sin firma
        shell: bash
        run: |
          set -euo pipefail
          rm -f AgendaClara/signing/development.jks
          rm -rf AgendaClara/.gradle AgendaClara/app/build
          zip -q -r Agenda-Clara-4.0.0-Fuentes-Verificadas.zip AgendaClara -x 'AgendaClara/signing/*' 'AgendaClara/*.jks' 'AgendaClara/*.keystore'
          if unzip -Z1 Agenda-Clara-4.0.0-Fuentes-Verificadas.zip | grep -Eq '\.(jks|keystore)$'; then exit 1; fi
      - name: Publicar fuentes 4.0.0
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-4.0.0-Fuentes-Verificadas
          path: Agenda-Clara-4.0.0-Fuentes-Verificadas.zip
          retention-days: 30
          if-no-files-found: error

  prueba-android-emulador:
    needs: construir-y-validar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtener pruebas de interfaz
        uses: actions/checkout@v4
      - name: Recuperar APK compilada
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-4.0.0-APK
          path: artifact-apk
      - name: Preparar aceleración para emulador
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Probar instalación y navegación en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: agenda-clara-ui
          disable-animations: true
          script: bash updates/phase11/emulator_schedule_plus.sh
      - name: Publicar capturas sintéticas del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-4.0.0-Emulator-Capturas
          path: screenshots/
          if-no-files-found: ignore
