name: Agenda Clara 3.13.5 - Correccion Nuevo Horario - QA real
on:
  push:
    branches: [fix/horario-entrada-3-13-5-20261105]
    paths:
      - 'updates/phase75/**'
      - '.github/workflows/agenda-clara-entry-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agenda-clara-entrega-c
  cancel-in-progress: true

jobs:
  validar-y-compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Recuperar fuentes verificadas de Agenda Clara 3.13.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41949630141 --repo "$GITHUB_REPOSITORY" \
            --name Agenda-Clara-3.13.4-Foto-Cursos-Nombre-Fuentes --dir source-artifact
          unzip -q source-artifact/Agenda-Clara-3.13.4-Foto-Cursos-Nombre-Fuentes.zip
          test -s AgendaClara/gradlew
      - name: Corregir la entrada Nuevo horario y probar ambos metodos
        run: |
          set -euo pipefail
          python3 updates/phase75/apply_creation_entry.py
          python3 updates/phase75/test_creation_entry.py
      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pruebas de fechas y cursos sin Android
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          javac -encoding UTF-8 -d "$OUT" \
            AgendaClara/app/src/main/java/pe/agendaclara/app/ScheduleTitleParser.java \
            updates/phase74/Phase74NameTests.java
          java -cp "$OUT" pe.agendaclara.app.Phase74NameTests
      - name: Recuperar firma privada de desarrollo
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_JKS_BASE64" || { echo 'Falta SIGNING_JKS_BASE64'; exit 1; }
          mkdir -p AgendaClara/signing
          printf '%s' "$SIGNING_JKS_BASE64" | base64 -d > AgendaClara/signing/development.jks
          chmod 600 AgendaClara/signing/development.jks
          keytool -list -keystore AgendaClara/signing/development.jks \
            -storepass android -alias agendaclara >/dev/null
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK 3.13.5 tras prueba del boton de Nuevo horario
        working-directory: AgendaClara
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar paquete y firma
        shell: bash
        run: |
          set -euo pipefail
          APK=AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -q "name='pe.agendaclara.app' versionCode='61' versionName='3.13.5'"
      - name: Adjuntar APK para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.13.5-Entrada-Horario-Corregida-APK
          path: AgendaClara/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publicar fuentes sin clave de firma
        shell: bash
        run: |
          set -euo pipefail
          rm -f AgendaClara/signing/development.jks
          rm -rf AgendaClara/.gradle AgendaClara/app/build AgendaClara/build
          zip -q -r Agenda-Clara-3.13.5-Entrada-Horario-Corregida-Fuentes.zip AgendaClara -x 'AgendaClara/signing/*' 'AgendaClara/*.jks'
      - name: Adjuntar fuentes verificadas
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.13.5-Entrada-Horario-Corregida-Fuentes
          path: Agenda-Clara-3.13.5-Entrada-Horario-Corregida-Fuentes.zip
          retention-days: 30

  verificar-en-emulador:
    needs: validar-y-compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtener pruebas
        uses: actions/checkout@v4
      - name: Recuperar APK
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-3.13.5-Entrada-Horario-Corregida-APK
          path: artifact-apk
      - name: Habilitar KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Instalar y abrir Agenda Clara en emulador Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: agenda-clara-entry-fix
          disable-animations: true
          script: |
            adb install -r artifact-apk/app-debug.apk
            adb shell am start -n pe.agendaclara.app/.MainActivity
            sleep 10
            adb shell pidof pe.agendaclara.app
            python3 updates/phase75/qa_emulator_creation.py
            adb logcat -d -t 500 | grep -E 'FATAL EXCEPTION|AndroidRuntime' && exit 1 || true
      - name: Adjuntar captura del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.13.5-Entrada-Horario-Corregida-Emulador
          path: screenshots/
          if-no-files-found: ignore
