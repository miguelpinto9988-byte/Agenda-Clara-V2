name: Publicar descarga directa Agenda Clara 2.5.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-apk-2-5.yml'

permissions:
  actions: read
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Descargar APK comprobada de la compilación 2.5.0
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-2.5.0-APK
          run-id: 40049454090
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Verificar integridad y preparar descarga
        shell: bash
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          echo '57c8c49819f3d8b395124fb724d63591a46ed277b8d0c74961b7d708b7186304  apk/app-debug.apk' | sha256sum --check
          unzip -t apk/app-debug.apk | tail -1
          mv apk/app-debug.apk apk/AgendaClara_2_5.apk
          echo 'Version 2.5.0; Android 8.0+; APK de desarrollo verificada con Android 15 en emulador.' > apk/LEEME.txt
          (cd apk && zip -q AgendaClara_2_5_Alternativa.zip AgendaClara_2_5.apk LEEME.txt)

      - name: Publicar archivos APK y ZIP en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if gh release view v2.5.0 --repo "$REPO" >/dev/null 2>&1; then
            gh release upload v2.5.0 apk/AgendaClara_2_5.apk apk/AgendaClara_2_5_Alternativa.zip --repo "$REPO" --clobber
          else
            gh release create v2.5.0 apk/AgendaClara_2_5.apk apk/AgendaClara_2_5_Alternativa.zip \
              --repo "$REPO" --target main --title 'Agenda Clara 2.5.0 - APK Android' \
              --notes 'APK compilada y firmada para actualizar Agenda Clara 2.4.0. Migración inicial a Kotlin + Jetpack Compose. Firma de desarrollo compatible con versiones anteriores. Haz copia de tus datos antes de instalar.'
          fi
          gh release view v2.5.0 --repo "$REPO" --json url,assets
