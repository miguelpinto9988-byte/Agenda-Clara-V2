name: Publicar APK directa Agenda Clara 2.6.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-apk-2-6.yml'
permissions:
  actions: read
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Descargar APK compilada y firmada
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-2.6.0-APK
          run-id: 40054195603
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Comprobar integridad de archivo de actualización
        shell: bash
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          echo 'dcb1db54cfa27901adce22056804aedf1c036daa58425500367cb3de772f094b  apk/app-debug.apk' | sha256sum --check
          unzip -t apk/app-debug.apk | tail -1
          mv apk/app-debug.apk apk/AgendaClara_2_6_Horario.apk
          printf 'Agenda Clara 2.6.0: horario de clases, OCR offline y avisos semanales. Instala sobre 2.5, sin desinstalar. Firma de desarrollo compatible.\n' > apk/LEEME.txt
          (cd apk && zip -q AgendaClara_2_6_Horario_Alternativa.zip AgendaClara_2_6_Horario.apk LEEME.txt)
      - name: Publicar APK y ZIP en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if gh release view v2.6.0 --repo "$REPO" >/dev/null 2>&1; then
            gh release upload v2.6.0 apk/AgendaClara_2_6_Horario.apk apk/AgendaClara_2_6_Horario_Alternativa.zip --repo "$REPO" --clobber
          else
            gh release create v2.6.0 apk/AgendaClara_2_6_Horario.apk apk/AgendaClara_2_6_Horario_Alternativa.zip \
              --repo "$REPO" --target main --title 'Agenda Clara 2.6.0 · Horario' \
              --notes 'APK Android con módulo de horarios, OCR local ML Kit y recordatorios semanales. Compilada con certificado de desarrollo compatible con versiones anteriores. Se recomienda copia de seguridad antes de actualizar. El reconocimiento de fotografías necesita revisión manual.'
          fi
          gh release view v2.6.0 --repo "$REPO" --json url,assets
