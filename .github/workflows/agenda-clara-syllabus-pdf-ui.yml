name: Agenda Clara 3.13.8 - Sílabos PDF real - QA sin recompilar
on:
  push:
    branches: [feat/silabos-examenes-finales-3-13-8-20261105]
    paths:
      - 'updates/phase78/qa_syllabus_pdf.py'
      - '.github/workflows/agenda-clara-syllabus-pdf-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  importar-silabo-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obtener scripts de sílabos
        uses: actions/checkout@v4
      - name: Descargar APK 3.13.8 ya compilada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact-apk
          gh run download 42093209511 --repo "$GITHUB_REPOSITORY" \
            --name Agenda-Clara-3.13.8-Silabos-Examenes-Finales-APK --dir artifact-apk
          test -s artifact-apk/app-debug.apk
      - name: Generar PDF de evaluación totalmente sintético
        shell: bash
        run: |
          set -euo pipefail
          python3 updates/phase78/generate_syllabus_pdf.py
          test -s /tmp/silabo_tendencias_2026.pdf
          python3 -c "from pathlib import Path; p=Path('/tmp/silabo_tendencias_2026.pdf'); assert p.read_bytes().startswith(b'%PDF-1.4') and b'/Type /Page' in p.read_bytes()"
      - name: Habilitar virtualización
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Importar PDF, seleccionar curso y verificar SQLite en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          avd-name: agenda-clara-syllabus-318
          disable-animations: true
          script: |
            adb install -r artifact-apk/app-debug.apk
            adb push /tmp/silabo_tendencias_2026.pdf /sdcard/Download/silabo_tendencias_2026.pdf
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Download/silabo_tendencias_2026.pdf
            python3 updates/phase78/qa_syllabus_pdf.py
      - name: Adjuntar capturas de revisión y vinculación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Clara-3.13.8-Importacion-Silabo-PDF-QA
          path: screenshots/*.png
          if-no-files-found: ignore
