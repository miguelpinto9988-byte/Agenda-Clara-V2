name: Agenda Clara · Entrega A · Pruebas de fuentes (SIN APK)
on:
  push:
    branches: [feat/plan-estudio-entrega-a-20261104]
    paths:
      - 'updates/phase71/**'
      - '.github/workflows/plan-a-static.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validar-fuentes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener scripts de Entrega A
        uses: actions/checkout@v4
      - name: Recuperar fuentes verificadas 3.13.2 (sin APK)
        uses: actions/download-artifact@v4
        with:
          name: Agenda-Clara-3.13.2-Fuentes-Verificadas
          repository: miguelpinto9988-byte/Agenda-Clara-V2
          run-id: 41897460411
          github-token: ${{ github.token }}
          path: previous-sources
      - name: Aplicar parche y validar únicamente fuentes
        shell: bash
        run: |
          set -euo pipefail
          test -s previous-sources/Agenda-Clara-3.13.2-Fuentes-Verificadas.zip
          unzip -q previous-sources/Agenda-Clara-3.13.2-Fuentes-Verificadas.zip
          python3 -m py_compile updates/phase71/apply_plan_a.py updates/phase71/patch_android_ui.py updates/phase71/test_plan_a.py
          python3 updates/phase71/apply_plan_a.py
          python3 updates/phase71/test_plan_a.py
          python3 updates/phase71/apply_plan_a.py
          python3 updates/phase71/test_plan_a.py
          mkdir -p /tmp/agendaclara-ocr-qa
          javac -encoding UTF-8 -d /tmp/agendaclara-ocr-qa updates/phase71/ScheduleTitleParser.java updates/phase71/ScheduleTitleParserTest.java
          java -cp /tmp/agendaclara-ocr-qa pe.agendaclara.app.ScheduleTitleParserTest
          echo "PASS: entrega A auditada en fuentes; SIN GRADLE, SIN APK, SIN PUBLICACIÓN"
